<!DOCTYPE html>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #F8F7FF;
      color: #0A0A0B;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      background: #fff;
      border: 1px solid #E5E5E8;

    .code {

      color: #6366F1; line-height: 1; margin-bottom: 16px;
    }

      font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
      color: #0A0A0B; margin-bottom: 12px;
    }
    p {
      font-size: 15px; color: #54545B; line-height: 1.6; margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: #6366F1;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #4F52D1; }

</head>

  <div class="card">
